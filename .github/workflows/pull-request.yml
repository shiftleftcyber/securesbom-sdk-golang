name: Pull Request CI

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  shared-go-ci:
    name: Shared Go CI
    permissions:
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/go-ci.yml@4b4b5d501f71784ab080a47f7ee300d8a9c052e3 # v1

  shared-go-lint:
    name: Shared Go lint
    permissions:
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/go-lint.yml@4b4b5d501f71784ab080a47f7ee300d8a9c052e3 # v1
    with:
      golangci-lint-version: v2.12.2

  shared-go-security:
    name: Shared Go security
    permissions:
      contents: read
      security-events: write
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/security-go.yml@4b4b5d501f71784ab080a47f7ee300d8a9c052e3 # v1
    with:
      # The repository dependency graph is currently disabled.
      run-dependency-review: false

  workflow-policy:
    name: Shared workflow policy
    permissions:
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/validate-actions.yml@4b4b5d501f71784ab080a47f7ee300d8a9c052e3 # v1

  shellcheck:
    name: Shared ShellCheck
    permissions:
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/shellcheck.yml@4b4b5d501f71784ab080a47f7ee300d8a9c052e3 # v1
    with:
      scan-directory: scripts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check formatting
        run: |
          make fmt-check

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/merged.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build examples
        run: make build-examples

      - name: Verify binaries
        run: |
          ./bin/sign -help
          ./bin/verify -help
          ./bin/keymgmt help

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate documentation
        run: make docs

      - name: Check for documentation changes
        run: |
          if [ -f docs/api-reference.txt ]; then
            echo "Documentation generated successfully"
          else
            echo "Documentation generation failed"
            exit 1
          fi

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Lint markdown files
        uses: nosborn/github-action-markdown-cli@508d6cefd8f0cc99eab5d2d4685b1d5f470042c1 # v3.5.0
        with:
          files: .
          config_file: .markdownlint.json
          ignore_files: vendor/

  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [shared-go-ci, shared-go-lint, shared-go-security, workflow-policy, shellcheck, lint, fmt-check, test, build, docs, markdown-lint]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.shared-go-ci.result }}" != "success" ] || \
             [ "${{ needs.shared-go-lint.result }}" != "success" ] || \
             [ "${{ needs.shared-go-security.result }}" != "success" ] || \
             [ "${{ needs.workflow-policy.result }}" != "success" ] || \
             [ "${{ needs.shellcheck.result }}" != "success" ] || \
             [ "${{ needs.fmt-check.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ] || \
             [ "${{ needs.markdown-lint.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed successfully"
