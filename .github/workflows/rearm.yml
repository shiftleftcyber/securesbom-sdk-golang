name: ReARM Workflow

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Determine project version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      project-version: ${{ steps.version.outputs.project-version }}
    steps:
      - name: Check out tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]] \
            && [[ ! "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "ReARM publication is restricted to main or a semantic version tag."
            exit 1
          fi
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [[ ! "${latest_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic vX.Y.Z tag is required before publishing ReARM evidence."
            exit 1
          fi
          base_version="${latest_tag#v}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            project_version="${GITHUB_REF_NAME#v}"
          else
            project_version="${base_version}-main-${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "${project_version}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,99}$ ]]; then
            echo "Resolved project version is invalid."
            exit 1
          fi
          echo "project-version=${project_version}" >> "${GITHUB_OUTPUT}"

  publish-rearm:
    name: Generate and publish ReARM evidence
    needs: version
    permissions:
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/rearm.yml@4b4b5d501f71784ab080a47f7ee300d8a9c052e3 # v1
    with:
      component-id: ${{ vars.REARM_COMPONENT_ID }}
      deliverable-name: securesbom-sdk-golang
      project-version: ${{ needs.version.outputs.project-version }}
      rearm-api-url: ${{ vars.REARM_API_URL }}
      secure-sbom-api-url: ${{ vars.SECURE_SBOM_API_URL }}
      secure-sbom-signing-key-id: ${{ vars.SECURE_SBOM_SIGNING_KEY_ID }}
      source-code-sbom-type: go
    secrets:
      rearm-api-id: ${{ secrets.REARM_COMPONENT_API_ID }}
      rearm-api-key: ${{ secrets.REARM_COMPONENT_API_KEY }}
      secure-sbom-api-key: ${{ secrets.SECURE_SBOM_API_KEY }}
