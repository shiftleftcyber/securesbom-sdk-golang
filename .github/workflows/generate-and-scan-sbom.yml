name: SBOM Generation, Signing, and Vulnerability Scanning

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  actions: read
  contents: read

jobs:
  authorize:
    name: Authorize evidence publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require main or a semantic version tag
        shell: bash
        env:
          TRUSTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${TRUSTED_REF}" == "refs/heads/main" ]] \
            || [[ "${TRUSTED_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            exit 0
          fi
          echo "SBOM signing and publication are restricted to main or a semantic version tag."
          exit 1

  source-sbom:
    name: Generate and protect source SBOM
    needs: authorize
    permissions:
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/source-sbom-go.yml@4b4b5d501f71784ab080a47f7ee300d8a9c052e3 # v1
    with:
      artifact-name: securesbom-sdk-golang-source-sbom
      component-type: library
      file-prefix: securesbom-sdk-golang
      secure-sbom-signing-key-id: ${{ vars.SECURE_SBOM_SIGNING_KEY_ID }}
    secrets:
      secure-sbom-api-key: ${{ secrets.SECURE_SBOM_API_KEY }}

  osv-scan:
    name: Scan unsigned source SBOM
    needs: source-sbom
    permissions:
      actions: read
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/scan-sbom-osv.yml@4b4b5d501f71784ab080a47f7ee300d8a9c052e3 # v1
    with:
      artifact-name: ${{ needs.source-sbom.outputs.artifact-name }}
      fail-on-vulnerabilities: false
      report-artifact-name: securesbom-sdk-golang-osv-reports
      sbom-file: ${{ needs.source-sbom.outputs.unsigned-sbom-file }}

  publish-interlynk:
    name: Publish signed source SBOM to Interlynk
    if: needs.source-sbom.outputs.component-count != '0'
    needs: source-sbom
    permissions:
      actions: read
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/publish-sbom-interlynk.yml@4b4b5d501f71784ab080a47f7ee300d8a9c052e3 # v1
    with:
      artifact-name: ${{ needs.source-sbom.outputs.artifact-name }}
      environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'Production' || 'Development' }}
      product: securesbom-sdk-golang
      sbom-file: ${{ needs.source-sbom.outputs.signed-sbom-file }}
    secrets:
      interlynk-security-token: ${{ secrets.INTERLYNK_TOKEN }}
