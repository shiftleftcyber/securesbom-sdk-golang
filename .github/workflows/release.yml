name: Release Go Product

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing draft release tag (for example, v2.8.1).
        required: true
        type: string

permissions:
  contents: read

jobs:
  go:
    name: Shared Go CI
    permissions:
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/go-ci.yml@v1 # zizmor: ignore[unpinned-uses]

  go-lint:
    name: Shared Go lint
    permissions:
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/go-lint.yml@v1 # zizmor: ignore[unpinned-uses]
    with:
      golangci-lint-version: v2.12.2

  source-sbom:
    name: Generate release SBOM
    permissions:
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/source-sbom-go.yml@v1 # zizmor: ignore[unpinned-uses]
    with:
      artifact-name: securesbom-sdk-golang-release-sbom
      component-type: library
      file-prefix: securesbom-sdk-golang-${{ inputs.release-tag }}
      go-version-file: go.mod
      secure-sbom-signing-key-id: ${{ vars.SECURE_SBOM_SIGNING_KEY_ID }}
      source-directory: .
    secrets:
      secure-sbom-api-key: ${{ secrets.SECURE_SBOM_API_KEY }}

  osv-scan:
    name: Scan release SBOM
    needs: source-sbom
    permissions:
      actions: read
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/scan-sbom-osv.yml@v1 # zizmor: ignore[unpinned-uses]
    with:
      artifact-name: ${{ needs.source-sbom.outputs.artifact-name }}
      fail-on-vulnerabilities: false
      report-artifact-name: securesbom-sdk-golang-release-osv-reports
      sbom-file: ${{ needs.source-sbom.outputs.unsigned-sbom-file }}

  release:
    name: Finalize draft release
    needs: [go, go-lint, source-sbom, osv-scan]
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/release-go.yml@v1 # zizmor: ignore[unpinned-uses]
    with:
      config: .goreleaser.yaml
      evidence-artifact-name: ${{ needs.source-sbom.outputs.artifact-name }}
      evidence-file: ${{ needs.source-sbom.outputs.signed-sbom-file }}
      go-version-file: go.mod
      release-tag: ${{ inputs.release-tag }}
      use-existing-draft: true
      working-directory: .

  publish-interlynk:
    name: Publish release SBOM to Interlynk
    if: needs.source-sbom.outputs.component-count != '0'
    needs: [source-sbom, osv-scan, release]
    permissions:
      actions: read
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/publish-sbom-interlynk.yml@v1 # zizmor: ignore[unpinned-uses]
    with:
      artifact-name: ${{ needs.source-sbom.outputs.artifact-name }}
      environment: Production
      product: securesbom-sdk-golang
      sbom-file: ${{ needs.source-sbom.outputs.signed-sbom-file }}
    secrets:
      interlynk-security-token: ${{ secrets.INTERLYNK_TOKEN }}
